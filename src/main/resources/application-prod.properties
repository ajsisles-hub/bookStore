spring.application.name=bookStore
server.port=9090


## ==========================================
## DATASOURCE CONFIGURATION
## ==========================================
## Using a file-based database so data persists between restarts.
#spring.datasource.url=${DATABASE_URL}
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=${DATABASE_USERNAME}
#spring.datasource.password=${DATABASE_PASSWORD}
#
#
## ==========================================
## JPA / HIBERNATE CONFIGURATION
## ==========================================
## CRITICAL: Must be set to 'validate' or 'none' when using Flyway,
## so Hibernate doesn't override Flyway's migration controls.
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.validator.apply_to_ddl=false
#
## ==========================================
## FLYWAY CONFIGURATION
## ==========================================
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#
#
#
#logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
#logging.level.org.flywaydb=DEBUG
management.endpoints.web.exposure.include=*