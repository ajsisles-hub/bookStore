spring.application.name=bookStore
server.port=8080
jwt.secret=${JWT_SECRET}

# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Using a file-based database so data persists between restarts.
spring.datasource.url=jdbc:h2:file:./data/bookstore;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# ==========================================
# H2 CONSOLE CONFIGURATION (Access via http://localhost:8080/h2-console)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allows connecting to the console without strict local-only network constraints
spring.h2.console.settings.web-allow-others=true

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# CRITICAL: Must be set to 'validate' or 'none' when using Flyway,
# so Hibernate doesn't override Flyway's migration controls.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG
management.endpoints.web.exposure.include=*


